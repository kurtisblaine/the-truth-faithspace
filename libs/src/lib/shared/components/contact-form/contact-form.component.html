<form
  [formGroup]="formData"
  (ngSubmit)="onSubmit(formData.value)"
  style="display: flex; flex-direction: column; max-width: 100%"
>
  <mat-form-field>
    <mat-label for="Email">Email</mat-label>
    <input
      matInput
      type="email"
      class="form-control"
      name="Email"
      aria-describedby="emailHelp"
      placeholder="Enter email"
      formControlName="Email"
      required
    />
    <!-- <mat-hint id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</mat-hint> -->
  </mat-form-field>
  <mat-form-field>
    <mat-label for="fullname">Full Name</mat-label>
    <input
      matInput
      type="text"
      class="form-control"
      name="Fullname"
      placeholder="Full Name"
      formControlName="Fullname"
    />
  </mat-form-field>
  @if(showMessage()) {
  <mat-form-field>
    <mat-label for="comment">Message</mat-label>
    <textarea matInput class="form-control" formControlName="Comment" name="Comment"></textarea>
  </mat-form-field>
  }

  <button
    mat-raised-button
    color="primary"
    type="submit"
    class="btn btn-primary"
    style="width: 100%; height: 44px"
    [disabled]="!formData.valid"
  >
    Submit
  </button>
</form>
