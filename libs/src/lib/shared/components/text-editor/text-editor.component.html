<form [formGroup]="form">
  <lib-narrator *ngIf="!showReadMore" [buttonStyle]="narratorStyle.Group" [text]="getText()"> </lib-narrator>

  <div class="editor" [ngClass]="{ limitTextHeight: isEmpty && showReadMore && !isReadMore }">
    @if(readonly) {
    <div class="readonly-editor" #readonlyHtml [innerHTML]="getReadonlyHtml()"></div>
    } @else {
    <ngx-editor-menu *ngIf="!readonly" [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>

    <ngx-editor
      #ngxeditor
      class="ngx-editor"
      [editor]="editor"
      formControlName="editorContent"
      [placeholder]="'Type here...'"
    >
    </ngx-editor>
    }
  </div>

  <button
    *ngIf="isEmpty && showReadMore"
    mat-flat-button
    type="button"
    (click)="showText()"
    style="width: 100%; padding: 0px"
  >
    {{ !isReadMore ? "See More" : "See Less" }}
  </button>
</form>
