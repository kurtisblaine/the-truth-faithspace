<ng-container [ngSwitch]="buttonStyle">
  <mat-button-toggle-group
    *ngSwitchCase="narratorStyle.Group"
    [(ngModel)]="thisLocalState"
    style="margin-bottom: 5px"
    matTooltip="The reader is {{ thisLocalState.toLowerCase() }}..."
    [hideSingleSelectionIndicator]="true"
  >
    <mat-button-toggle (click)="startReading()" [value]="speechStatus.Playing">
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
    <mat-button-toggle (click)="pauseReading()" [value]="speechStatus.Paused">
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
    <mat-button-toggle (click)="stopReading()" [value]="speechStatus.Stopped">
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>

  <div *ngSwitchCase="narratorStyle.Flex" style="display: flex; justify-content: center; margin-bottom: 5px">
    <button mat-icon-button (click)="startReading()">
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </button>
    <button mat-icon-button (click)="pauseReading()">
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </button>
    <button mat-icon-button (click)="stopReading()">
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </button>
  </div>

  <div *ngSwitchCase="narratorStyle.Fab" style="display: flex; justify-content: center; margin-bottom: px">
    <button mat-mini-fab (click)="startReading()">
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="pauseReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped"
    >
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="stopReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped"
    >
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </button>
  </div>
</ng-container>

<div #textContainer>
  <ng-content></ng-content>
</div>
