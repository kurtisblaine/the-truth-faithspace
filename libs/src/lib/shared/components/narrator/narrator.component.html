<ng-container [ngSwitch]="buttonStyle">
  <mat-button-toggle-group
    *ngSwitchCase="narratorStyle.Group"
    [(ngModel)]="thisLocalState"
    style="margin-bottom: 5px"
    [hideSingleSelectionIndicator]="true"
  >
    <mat-button-toggle
      (click)="startReading()"
      [value]="speechStatus.Playing"
      [disabled]="isAnotherPlaying"
      title="Play button"
      aria-labelledby="Play button"
      aria-label="Play button"
    >
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
    <mat-button-toggle
      (click)="pauseReading()"
      [value]="speechStatus.Paused"
      [disabled]="isAnotherPlaying"
      title="Pause button"
      aria-labelledby="Pause button"
      aria-label="Pause button"
    >
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
    <mat-button-toggle
      (click)="stopReading()"
      [value]="speechStatus.Stopped"
      title="Stop button"
      aria-labelledby="Stop button"
      aria-label="Stop button"
    >
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>

  <div *ngSwitchCase="narratorStyle.Flex" style="display: flex; justify-content: center; margin-bottom: 5px">
    <button mat-icon-button (click)="startReading()">
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </button>
    <button mat-icon-button (click)="pauseReading()">
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </button>
    <button mat-icon-button (click)="stopReading()">
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </button>
  </div>

  <div *ngSwitchCase="narratorStyle.Fab" style="display: flex; justify-content: center; margin-bottom: px">
    <button
      mat-mini-fab
      (click)="startReading()"
      [disabled]="isAnotherPlaying"
      title="Play button"
      aria-labelledby="Play button"
      aria-label="Play button"
    >
      <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="pauseReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped || isAnotherPlaying"
      title="Pause button"
      aria-labelledby="Pause button"
      aria-label="Pause button"
    >
      <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="stopReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped && !isAnotherPlaying"
      title="Stop button"
      aria-labelledby="Stop button"
      aria-label="Stop button"
    >
      <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
    </button>
  </div>
</ng-container>

<div #textContainer>
  <ng-content></ng-content>
</div>
