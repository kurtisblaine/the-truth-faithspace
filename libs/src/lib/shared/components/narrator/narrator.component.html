<ng-container [ngSwitch]="buttonStyle">
  <div *ngSwitchCase="narratorStyle.Group">
    <mat-button-toggle-group
      [(ngModel)]="thisLocalState"
      style="margin-bottom: 5px"
      [hideSingleSelectionIndicator]="true"
    >
      <mat-button-toggle
        (click)="startReading()"
        [value]="speechStatus.Playing"
        [disabled]="isAnotherPlaying"
        aria-labelledby="Play button"
        aria-label="Play button"
      >
        <lib-fa-icon [icon]="playIcon"></lib-fa-icon>
      </mat-button-toggle>
      <mat-button-toggle
        (click)="pauseReading()"
        [value]="speechStatus.Paused"
        [disabled]="isAnotherPlaying"
        aria-labelledby="Pause button"
        aria-label="Pause button"
      >
        <lib-fa-icon [icon]="pauseIcon"></lib-fa-icon>
      </mat-button-toggle>
      <mat-button-toggle
        (click)="stopReading()"
        [value]="speechStatus.Stopped"
        aria-labelledby="Stop button"
        aria-label="Stop button"
      >
        <lib-fa-icon [icon]="stopIcon"></lib-fa-icon>
      </mat-button-toggle>
      @if(downloadLink) {
      <mat-button-toggle
        (click)="downloadAudio(downloadLink)"
        [value]="speechStatus.Download"
        aria-labelledby="Download button"
        aria-label="Download button"
      >
        <lib-fa-icon [icon]="downloadIcon"></lib-fa-icon>
      </mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>

  <div *ngSwitchCase="narratorStyle.Flex" style="display: flex; justify-content: center; margin-bottom: 5px">
    <button mat-icon-button (click)="startReading()">
      <lib-fa-icon [icon]="playIcon"></lib-fa-icon>
    </button>
    <button mat-icon-button (click)="pauseReading()">
      <lib-fa-icon [icon]="pauseIcon"></lib-fa-icon>
    </button>
    <button mat-icon-button (click)="stopReading()">
      <lib-fa-icon [icon]="stopIcon"></lib-fa-icon>
    </button>
  </div>

  <div *ngSwitchCase="narratorStyle.Fab" style="display: flex; justify-content: center; margin-bottom: 5px">
    <button
      mat-mini-fab
      (click)="startReading()"
      [disabled]="isAnotherPlaying"
      aria-labelledby="Play button"
      aria-label="Play button"
    >
      <lib-fa-icon [icon]="playIcon"></lib-fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="pauseReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped || isAnotherPlaying"
      aria-labelledby="Pause button"
      aria-label="Pause button"
    >
      <lib-fa-icon [icon]="pauseIcon"></lib-fa-icon>
    </button>
    <button
      mat-mini-fab
      (click)="stopReading()"
      style="margin-left: 3px"
      [disabled]="thisLocalState === speechStatus.Stopped && !isAnotherPlaying"
      aria-labelledby="Stop button"
      aria-label="Stop button"
    >
      <lib-fa-icon [icon]="stopIcon"></lib-fa-icon>
    </button>

    @if(downloadLink) {
    <button
      mat-mini-fab
      (click)="downloadAudio(downloadLink)"
      aria-labelledby="Download button"
      aria-label="Download button"
      style="margin-left: 5px"
    >
      <lib-fa-icon [icon]="downloadIcon"></lib-fa-icon>
    </button>
    }
  </div>
</ng-container>

<div #textContainer>
  <ng-content></ng-content>
</div>
