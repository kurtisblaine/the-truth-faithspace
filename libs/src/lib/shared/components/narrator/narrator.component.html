<div style="display: flex; justify-content: space-around">
  <button mat-icon-button (click)="startReading()">
    <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
  </button>
  <button mat-icon-button (click)="pauseReading()" [disabled]="">
    <fa-icon [icon]="pauseIcon" [size]="'lg'"></fa-icon>
  </button>
  <button mat-icon-button (click)="resumeReading()">
    <fa-icon [icon]="playIcon" [size]="'lg'"></fa-icon>
  </button>
  <button mat-icon-button (click)="stopReading()">
    <fa-icon [icon]="stopIcon" [size]="'lg'"></fa-icon>
  </button>
</div>

<div #textContainer>
  <ng-content></ng-content>
</div>
