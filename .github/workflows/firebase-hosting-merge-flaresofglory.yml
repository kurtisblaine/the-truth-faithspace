name: Deploy - Flares of Glory
on:
  push:
    branches:
      - master
    paths:
      - "apps/flaresofglory/**"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --force && npx nx build flaresofglory --prod --output-path apps/flaresofglory/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLARESOFGLORY }}
          channelId: live
          projectId: flaresofglory
          entryPoint: ./apps/flaresofglory
