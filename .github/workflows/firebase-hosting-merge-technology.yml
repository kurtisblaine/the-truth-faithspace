name: Deploy - Technology
on:
  push:
    branches:
      - master
    paths:
      - "apps/technology/**"
jobs:
  build_and_deploy-technology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install --force && npx nx build technology --prod --output-path apps/technology/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHINING_LIGHT_ON_THE_DARK_WEB }}"
          channelId: live
          projectId: shining-light-on-the-dark-web
          entryPoint: ./apps/technology
