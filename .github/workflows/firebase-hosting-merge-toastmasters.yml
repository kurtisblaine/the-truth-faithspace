name: Deploy - Toastmasters
on:
  push:
    branches:
      - master
    paths:
      - "apps/toastmasters/**"
jobs:
  build_and_deploy-toastmasters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --force && npx nx build toastmasters --prod --output-path apps/toastmasters/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOASTMASTERS211 }}
          channelId: live
          projectId: toastmasters211
          entryPoint: ./apps/toastmasters
