name: Deploy - Bible
on:
  push:
    branches:
      - master
    paths:
      - "apps/bible/**"
jobs:
  build_and_deploy-bible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --force && npx nx build bible --prod --output-path apps/bible/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIBLE_TRUTH_THE_TRUE_ONE }}
          channelId: live
          projectId: the-truth-as-in-the-beginning
          entryPoint: ./apps/bible
