name: Deploy - Prophesy
on:
  push:
    branches:
      - master
    paths:
      - "apps/prophesy/**"
jobs:
  build_and_deploy-biblical-prophesy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --force && npx nx build prophesy --prod --output-path apps/prophesy/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIBLICAL_PROPHESY }}
          channelId: live
          projectId: biblical-prophesy
          entryPoint: ./apps/prophesy
