name: Deploy - Dave's Drywall & Painting
on:
  push:
    branches:
      - master
    paths:
      - "apps/quality-painting/**"
jobs:
  build_and_deploy-quality-painting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --force && npx nx build quality-painting --prod --output-path apps/quality-painting/public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAVESQUALITYPAINTING }}
          channelId: live
          projectId: davesqualitypainting
          entryPoint: ./apps/quality-painting
