<div class="checkout-page">
  <mat-card style="margin: 25px">
    <mat-card-header>
      <mat-card-title style="margin-top: -16px; margin-left: -16px; margin-right: -16px; margin-bottom: 16px">
        Shipping Information
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div [formGroup]="checkoutForm">
        <div style="display: flex; flex-direction: row; gap: 10px">
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>Full Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" placeholder="you@example.com" />
          </mat-form-field>
        </div>
        <div style="display: flex; flex-direction: row; gap: 10px">
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>Address Line 1</mat-label>
            <input matInput formControlName="address" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>Address Line 2</mat-label>
            <input matInput formControlName="address" placeholder="Apt, Suite, Unit Number, Etc" />
          </mat-form-field>
        </div>
        <div style="display: flex; flex-direction: row; gap: 10px">
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>City</mat-label>
            <input matInput formControlName="city" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>State</mat-label>
            <input matInput formControlName="state" />
          </mat-form-field>
          <mat-form-field appearance="outline" style="flex: 1">
            <mat-label>ZIP Code</mat-label>
            <input matInput formControlName="zipcode" />
          </mat-form-field>
        </div>
        <div style="margin-bottom: 10px"></div>
        @if (elementsOptions.clientSecret) {
        <ngx-stripe-elements
        [stripe]="stripe"
        [elementsOptions]="elementsOptions"
      >
        <ngx-stripe-payment />
      </ngx-stripe-elements>
        }
        <div style="margin-bottom: 20px"></div>
        <mat-divider></mat-divider>
        <div style="margin-bottom: 20px"></div>
        <div style="text-align: right">
          <button mat-stroked-button color="warn" [disabled]="paying" (click)="clear()" style="margin-right: 16px">
            CLEAR
          </button>
          <button mat-raised-button color="primary" [disabled]="paying()" (click)="collectPayment()">
            @if (paying()) {
            <span>PROCESSING...</span>
            } @else {
            <span>
              PAY @if (amount) {
              <span>{{ amount | currency }}</span>
              }
            </span>
            }
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title style="margin-top: -16px; margin-left: -16px; margin-right: -16px; margin-bottom: 16px">
        Order Summary
      </mat-card-title>
      <mat-card-subtitle> <button mat-button (click)="goCart()">Modify Order</button></mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        @for(product of cartProducts$ | async; track product) {
        <mat-list-item lines="3">
          <img matListItemAvatar class="product-image" [ngSrc]="product.image" [alt]="product.name" fill />
          <span matListItemTitle>{{ product.name }}</span>
          <span matListItemLine>{{ product.size }}</span>
          <span matListItemLine>{{ product.count }} | {{ product.price | currency: "USD" }}</span>
        </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
