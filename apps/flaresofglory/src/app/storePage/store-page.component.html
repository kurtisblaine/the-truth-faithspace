<div style="padding: 20px; height: 100%">
  <h1>Store</h1>

  <mat-tab-group>
    <mat-tab label="Sweatshirts & Hoodies">
      <mat-grid-list cols="2" rowHeight="2:1" gutterSize="16">
        @for (product of products$ | async; track product) {
        <mat-grid-tile (click)="selectProduct(product.id)" class="tile">
          <mat-card appearance="outlined">
            <mat-card-header>
              <mat-card-title>{{ product.name }}</mat-card-title>
              <mat-card-subtitle>{{ product.price | currency: "USD" }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content class="image-container">
              <div style="width: 100%; height: 100vh">
                <img
                  mat-card-image
                  [ngSrc]="product.image"
                  [alt]="product.name"
                  fill
                  priority
                  style="object-fit: contain; background-size: cover"
                />
              </div>
            </mat-card-content>
            <mat-card-footer style="padding: 16px">
              {{ product.description }}
            </mat-card-footer>
          </mat-card>
        </mat-grid-tile>
        }
      </mat-grid-list>
    </mat-tab>
    <mat-tab label="Accessories"> </mat-tab>
  </mat-tab-group>
</div>
