<mat-grid-list cols="2" rowHeight="2:1" gutterSize="50">
  @for (product of products; track product) {
  <mat-grid-tile>
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ product.title }}</mat-card-title>
        <mat-card-subtitle>{{ product.subtitle }}</mat-card-subtitle>
      </mat-card-header>
      <div class="image-container">
        <img
          mat-card-image
          [ngSrc]="product.image"
          [alt]="product.subtitle"
          fill
          style="object-fit: contain; background-size: cover"
        />
      </div>
      <mat-card-content>
        <p>
          {{ product.description }}
        </p>
      </mat-card-content>
      <mat-card-actions>
        <mat-button-toggle-group name="size" aria-label="Size">
          <mat-button-toggle value="small">Small</mat-button-toggle>
          <mat-button-toggle value="medium">Medium</mat-button-toggle>
          <mat-button-toggle value="large">Large</mat-button-toggle>
          <mat-button-toggle value="xlarge">X-Large</mat-button-toggle>
        </mat-button-toggle-group>
        <button matButton>Add to Cart</button>
      </mat-card-actions>
    </mat-card>
  </mat-grid-tile>
  }
</mat-grid-list>
