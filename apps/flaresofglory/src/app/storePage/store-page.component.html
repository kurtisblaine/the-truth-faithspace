<h1>Store</h1>

<mat-grid-list cols="2" rowHeight="2:1" gutterSize="50">
  @for (product of products$ | async; track product) {
  <mat-grid-tile matRipple (click)="selectProduct(product.id)" class="select-container">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>{{ product.price | currency: "USD" }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content style="overflow: hidden">
        <div style="display: flex">
          <img
            mat-card-image
            [ngSrc]="product.image"
            [alt]="product.name"
            fill
            style="object-fit: contain; background-size: cover"
          />
        </div>
      </mat-card-content>
      <mat-card-footer>
        {{ product.description }}
      </mat-card-footer>

          <mat-button-toggle value="large">L</mat-button-toggle>
          <mat-button-toggle value="xlarge">XL</mat-button-toggle>
        </mat-button-toggle-group>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">

          <input
            matInput
            aria-label="Quantity Input"

            type="number"

        <button matButton (click)="addToCart(product)" [disabled]="!product.count || !product.size">Add to Cart</button>
      </mat-card-actions> -->
    </mat-card>
  </mat-grid-tile>
  }
</mat-grid-list>
