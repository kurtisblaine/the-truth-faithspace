<div class="container-form" style="margin: 0px 17px">
  <router-outlet></router-outlet>

  <h2 style="padding: 15px 0px 0px" class="fixed-primary-color" [@slideInFromLeft]>News Updates</h2>
  <div style="padding-bottom: 15px" class="mat-caption" #seoCaption [@slideInFromRight]>
    Important updates from the Toastmasters
  </div>

  <div [@fadeInOut]>
    @if(isLoading$ | async) {
    <mat-spinner></mat-spinner>
    } @else {
    <app-item-list></app-item-list>
    }
  </div>
</div>
