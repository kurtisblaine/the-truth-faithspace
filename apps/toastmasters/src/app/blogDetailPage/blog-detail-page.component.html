<mat-card style="margin: 15px" *ngIf="item$ | async as item" [@fadeInOut]>
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title #seoTitle>
        <h3 class="item-title primary-color" style="margin-top: 7px">{{ item?.title }}</h3>
      </mat-card-title>
      <mat-card-subtitle style="margin-bottom: 12px" #seoCaption>
        <div>{{ item?.date | date: "short" }}</div>
      </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>

  <mat-card-content>
    <lib-readonly-text-editor
      [html]="item?.json?.toString()"
      [showReadMore]="false"
      [showAudioReader]="false"
    ></lib-readonly-text-editor>
  </mat-card-content>
</mat-card>
