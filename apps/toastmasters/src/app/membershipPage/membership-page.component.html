<div class="w3-container w3-padding-64 w3-center" id="team">
  <div #teamHeader>
    @defer (on viewport(teamHeader)) {
    <h2 [@slideInFromRight]>TEAM</h2>
    }
  </div>

  <div #teamSubHeader>
    @defer (on viewport(teamSubHeader)) {
    <p [@slideInFromLeft]>Our current members</p>
    }
  </div>

  <app-member-details></app-member-details>
</div>

<mat-divider></mat-divider>

<div class="w3-container w3-padding-64 w3-center">
  <div #eventHeader>
    @defer (on viewport(eventHeader)) {
    <h2 [@slideInFromRight]>JOIN</h2>
    }
  </div>

  <div #teamSubHeader>
    @defer (on viewport(teamSubHeader)) {
    <p [@slideInFromLeft]>Attend as a guest</p>
    }
  </div>

  <div style="padding: 0px 30px; padding-top: 7px" [@fadeInOut]>
    <lib-contact-form
      formSpreeApi="https://formspree.io/f/todo"
      [isMessageRequired]="false"
      [showMessage]="false"
      [onSubmitMessage]="'Thank you for showing interest in attending an event. We will get in touch with you shortly.'"
    ></lib-contact-form>
  </div>
</div>
