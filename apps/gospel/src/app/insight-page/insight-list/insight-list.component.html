<div class="insight-item" *ngFor="let insight of pagedInsights()">
  <div class="insight-title primary-color">
    <blog-link [link]="'https://thelightof.life/insights/insight-detail/' + insight.id"
      >{{ insight.title }}
      <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
    </blog-link>
  </div>
  <div>{{ insight.date | date: "short" }}</div>

  @if(update) {
  <button mat-flat-button (click)="doUpdate(insight)">Update</button>
  <lib-text-editor [document]="insight.json" (editorChanged)="updatedJson = $event"></lib-text-editor>
  } @else {
  <lib-readonly-text-editor [html]="insight?.json?.toString()"></lib-readonly-text-editor>
  }

  <mat-divider></mat-divider>
</div>

<mat-paginator
  [length]="total"
  [showFirstLastButtons]="true"
  [pageSize]="5"
  (page)="onPageChange($event)"
></mat-paginator>
