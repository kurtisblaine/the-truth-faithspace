<div class="insight-item" *ngFor="let insight of insights$ | async">
  <div class="insight-title primary-color" (click)="navigate(insight)">
    {{ insight.title }}
    <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
  </div>
  <div>{{ insight.date | date: "short" }}</div>

  @if(update) {
  <button mat-flat-button (click)="doUpdate(insight)">Update</button>
  <lib-text-editor [document]="insight.json" (editorChanged)="insight.json = $event"></lib-text-editor>
  } @else {
  <lib-readonly-text-editor [html]="insight?.json?.toString()"></lib-readonly-text-editor>
  }

  <mat-divider></mat-divider>
</div>
