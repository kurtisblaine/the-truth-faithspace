<mat-card style="margin: 15px">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>
        <h3 class="blog-title primary-color">
          {{ blog?.title?.toUpperCase() }}
        </h3>
      </mat-card-title>
      <mat-card-subtitle>
        <div>{{ blog?.date | date: "short" }}</div>
      </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>

  <mat-card-content>
    <lib-text-editor [readonly]="true" [document]="blog.json" [showReadMore]="false"></lib-text-editor>
  </mat-card-content>
</mat-card>
