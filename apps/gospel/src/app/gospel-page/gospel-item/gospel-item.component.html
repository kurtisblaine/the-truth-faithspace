<mat-card style="margin: 15px">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title #seoTitle>
        <h2 class="blog-title primary-color">{{ page() | dashToTitle }}</h2>
      </mat-card-title>
      <mat-card-subtitle>
        {{ description() }}
      </mat-card-subtitle>
      <mat-card-subtitle>
        <lib-narrator [buttonStyle]="narratorStyle.Group" [text]="content?.innerText ?? ''"> </lib-narrator>
      </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>

  <mat-card-content #content>
    <ng-container #textContainer></ng-container>
  </mat-card-content>
</mat-card>
