<mat-card
  appearance="outlined"
  class="header-card"
  [class]="{ 'header-light': isLightMode, 'header-dark': !isLightMode }"
>
  <mat-card-header>
    <mat-card-title-group style="justify-content: center">
      <mat-card-title>
        <ng-content></ng-content>
      </mat-card-title>
      <mat-card-subtitle> </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>
</mat-card>
