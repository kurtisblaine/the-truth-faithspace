<mat-grid-list cols="5" rowHeight="1.1:2" gutterSize="5" [photoGalleryGroup]="{}">
  <mat-grid-tile *ngFor="let image of this.images" style="cursor: pointer">
    <mat-grid-tile-header
      (click)="navigate(image)"
      class="primary-color"
      style="text-decoration: underline; cursor: pointer"
      >{{ image.name }}
      <fa-icon [icon]="faLink" [size]="'lg'" style="padding-left: 2px"></fa-icon>
    </mat-grid-tile-header>
    <mat-grid-tile-footer>{{ image.footer }}</mat-grid-tile-footer>
    <div [photoGallery]="image.originUrl" [photoGalleryCaption]="image.name + ' - ' + image.description">
      <img role="presentation" style="max-width: 100%; max-height: 100%" loading="lazy" [src]="image.originUrl" />
    </div>
  </mat-grid-tile>
</mat-grid-list>
