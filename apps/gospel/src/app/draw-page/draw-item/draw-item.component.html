<h3 style="padding: 15px 15px 0px" class="primary-color">{{ this.selectedImage.name }}</h3>
<div style="padding-bottom: 15px" class="mat-caption" style="margin: 0px 17px">
  {{ this.selectedImage.description }}
</div>
<br />

<div style="padding: 0px 100px; padding-bottom: 25px">
  <pinch-zoom [autoHeight]="true" [limit-zoom]="2">
    <img style="max-width: 100%; max-height: 100%" [src]="selectedImage.originUrl" />
  </pinch-zoom>
</div>
