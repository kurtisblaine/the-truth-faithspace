<div style="margin: 0px 17px">
  <gospel-page-header>
    <h1 #seoTitle>{{ this.selectedImage.name }}</h1>
    <h2>Drawing</h2>
  </gospel-page-header>
  <div style="padding-bottom: 15px" #seoCaption class="mat-caption">
    {{ this.selectedImage.description }}
  </div>

  <div style="height: 67vh; padding-top: 7px">
    @if(isPlatformBrowser) {
    <pinch-zoom [autoHeight]="true" [limit-zoom]="2" style="height: 100%; margin: 0px 40px">
      <img
        style="max-width: 100%; max-height: 100%; object-fit: contain; position: unset"
        [ngSrc]="selectedImage.originUrl"
        [alt]="this.selectedImage.name"
        fill
        priority
      />
    </pinch-zoom>
    } @else {
    <img
      style="max-width: 100%; max-height: 100%; object-fit: contain; position: unset"
      [ngSrc]="selectedImage.originUrl"
      [alt]="selectedImage.name"
      fill
      priority
    />
    }
  </div>
</div>
