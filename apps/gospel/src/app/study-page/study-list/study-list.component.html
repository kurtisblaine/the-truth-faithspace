<div class="study-item" *ngFor="let study of studies$ | async">
  <div class="study-title primary-color" (click)="navigate(study)">
    {{ study.title }}
    <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
  </div>
  <div>{{ study.date | date: "short" }}</div>

  @if(update) {
  <button mat-flat-button (click)="doUpdate(study)">Update</button>
  <lib-text-editor [document]="study.json" (editorChanged)="study.json = $event"></lib-text-editor>
  } @else {
  <lib-readonly-text-editor [html]="study?.json?.toString()"></lib-readonly-text-editor>
  }

  <mat-divider></mat-divider>
</div>
