<div class="study-page">
  @if(!update) {
  <lib-filter style="flex: 1 1 20%" (onChange)="searchTerm.set($event)"></lib-filter>
  }

  <div style="flex: 1 1 80%">
    <div class="study-item" *ngFor="let study of pagedStudies()">
      <div class="study-title primary-color">
        <lib-link [link]="baseUrl + '/studies/study-detail/' + study.url">
          <div style="display: flex; align-items: baseline">
            <h3 [matTooltip]="`${study.title} - ${study.id}`">{{ study.title }}</h3>
            <lib-fa-icon [icon]="faLink" style="padding-left: 4px; font-size: large"></lib-fa-icon>
          </div>
        </lib-link>
      </div>
      <div>{{ study.date | date: "short" }}</div>

      @if(update) {
      <button mat-flat-button (click)="doUpdate(study)">Update</button>
      <lib-text-editor [document]="study.json" (editorChanged)="updatedJson = $event"></lib-text-editor>
      } @else {
      <lib-readonly-text-editor
        [html]="study?.json?.toString() | highlight: searchTerm()"
        [link]="baseUrl + '/studies/study-detail/' + study.url"
      ></lib-readonly-text-editor>
      }

      <mat-divider></mat-divider>
    </div>

    <mat-paginator
      [length]="total()"
      [showFirstLastButtons]="true"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[initialPageSize, total()]"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</div>
