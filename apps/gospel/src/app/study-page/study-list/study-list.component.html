<div class="study-item" *ngFor="let study of studies$ | async">
  <div class="study-title primary-color" (click)="navigate(study)">
    {{ study.title }}
    <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
  </div>
  <div>{{ study.date | date: "short" }}</div>

  <button mat-flat-button *ngIf="update" (click)="doUpdate(study)">Update</button>

  <lib-text-editor
    [readonly]="!update"
    [document]="study?.json"
    (editorChanged)="study.json = $event"
  ></lib-text-editor>

  <mat-divider></mat-divider>
</div>
