<div class="study-page">
  @if(!update) {
  <lib-filter style="flex: 1 1 20%" (onChange)="searchTerm.set($event)"></lib-filter>
  }

  <div style="flex: 1 1 80%">
    <div class="study-item" *ngFor="let study of pagedStudies()">
      <div class="study-title primary-color">
        <lib-link [link]="baseUrl + '/studies/study-detail/' + study.id"
          >{{ study.title }}
          <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
        </lib-link>
      </div>
      <div>{{ study.date | date: "short" }}</div>

      @if(update) {
      <button mat-flat-button (click)="doUpdate(study)">Update</button>
      <lib-text-editor [document]="study.json" (editorChanged)="updatedJson = $event"></lib-text-editor>
      } @else {
      <lib-readonly-text-editor
        [html]="study?.json?.toString()"
        [link]="baseUrl + '/studies/study-detail/' + study.id"
      ></lib-readonly-text-editor>
      }

      <mat-divider></mat-divider>
    </div>

    <mat-paginator
      [length]="total()"
      [showFirstLastButtons]="true"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</div>
