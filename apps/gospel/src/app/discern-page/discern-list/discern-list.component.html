<div class="discern-page">
  @if(!update) {
  <lib-filter style="flex: 1 1 20%" (onChange)="searchTerm.set($event)"></lib-filter>
  }

  <div style="flex: 1 1 80%">
    <div class="discern-item" *ngFor="let discern of pagedDiscernments()">
      <div class="discern-title primary-color">
        <lib-link [link]="baseUrl + '/discernments/discernment-detail/' + discern.url">
          <div style="display: flex; align-items: baseline">
            <h3 [matTooltip]="`${discern.title} - ${discern.id}`">{{ discern.title }}</h3>
            <lib-fa-icon [icon]="faLink" style="padding-left: 4px; font-size: large"></lib-fa-icon>
          </div>
        </lib-link>
      </div>
      <div>{{ discern.date | date: "short" }}</div>

      @if(update) {
      <button mat-flat-button (click)="doUpdate(discern)">Update</button>
      <lib-text-editor [document]="discern.json" (editorChanged)="updatedJson = $event"></lib-text-editor>
      } @else {
      <lib-readonly-text-editor
        [html]="discern?.json?.toString() | highlight: searchTerm()"
        [link]="baseUrl + '/discernments/discernment-detail/' + discern.url"
      ></lib-readonly-text-editor>
      }

      <mat-divider></mat-divider>
    </div>
    <mat-paginator
      [length]="total()"
      [showFirstLastButtons]="true"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[initialPageSize, total()]"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</div>
