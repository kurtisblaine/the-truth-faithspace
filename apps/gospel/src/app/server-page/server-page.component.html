<button mat-flat-button (click)="savePsalm()">Post Poem</button>
<button mat-flat-button (click)="saveInsight()">Post Insight</button>
<button mat-flat-button (click)="saveBlog()">Post Edification</button>
<button mat-flat-button (click)="saveDiscernment()">Post Discern</button>
<button mat-flat-button (click)="saveStudy()">Post Study</button>

<div style="display: flex; flex-direction: column; margin: 10px">
  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput type="text" [(ngModel)]="title" required />
  </mat-form-field>

  <lib-text-editor (editorChanged)="onChange($event)"></lib-text-editor>
</div>

<mat-accordion class="example-headers-align" multi>
  <mat-expansion-panel (opened)="loadBlogs()">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <h4 style="padding: 15px 15px 0px" class="primary-color">Edifications</h4>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <blog-blog-list [update]="true"></blog-blog-list>
    </ng-template>
  </mat-expansion-panel>

  <mat-expansion-panel (opened)="loadDiscernments()">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <h4 style="padding: 15px 15px 0px" class="primary-color">Discernments</h4>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <blog-discern-list [update]="true"></blog-discern-list>
    </ng-template>
  </mat-expansion-panel>

  <mat-expansion-panel (opened)="loadInsights()">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <h4 style="padding: 15px 15px 0px" class="primary-color">Insights</h4>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <blog-insight-list [update]="true"></blog-insight-list>
    </ng-template>
  </mat-expansion-panel>

  <mat-expansion-panel (opened)="loadPsalms()">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <h4 style="padding: 15px 15px 0px" class="primary-color">Poems</h4>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <blog-psalm-list [update]="true"></blog-psalm-list>
    </ng-template>
  </mat-expansion-panel>

  <mat-expansion-panel (opened)="loadStudies()">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <h4 style="padding: 15px 15px 0px" class="primary-color">Studies</h4>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <blog-study-list [update]="true"></blog-study-list>
    </ng-template>
  </mat-expansion-panel>
</mat-accordion>
