<div class="psalm-item" *ngFor="let psalm of psalms$ | async">
  <div class="psalm-title primary-color" (click)="navigate(psalm)">
    {{ psalm.title }}
    <lib-fa-icon [icon]="faLink" style="padding-left: 2px"></lib-fa-icon>
  </div>
  <div>{{ psalm.date | date: "short" }}</div>

  <button mat-flat-button *ngIf="update" (click)="doUpdate(psalm)">Update</button>

  <lib-text-editor
    [readonly]="!update"
    [document]="psalm?.json"
    (editorChanged)="psalm.json = $event"
  ></lib-text-editor>

  <mat-divider></mat-divider>
</div>
