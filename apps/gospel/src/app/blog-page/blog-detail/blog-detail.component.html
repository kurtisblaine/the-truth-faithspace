<mat-card style="margin: 15px">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>
        <gospel-page-header>
          <h1>{{ blog()?.title }}</h1>
          <h2>Edification</h2>
        </gospel-page-header>
      </mat-card-title>
      <mat-card-subtitle>
        <div>{{ blog()?.date | date: "short" }}</div>
      </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>

  <mat-card-content>
    <lib-readonly-text-editor [html]="blog()?.json?.toString()" [showReadMore]="false"></lib-readonly-text-editor>
  </mat-card-content>
</mat-card>
