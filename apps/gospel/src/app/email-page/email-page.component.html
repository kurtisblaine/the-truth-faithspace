<div class="container-form" style="margin: 0px 17px">
  <h1 style="padding: 15px 0px 0px" class="primary-color">Peace</h1>
  <h1 style="padding: 15px 0px 0px" class="primary-color">Contact me</h1>
  <h6 class="mat-caption">
    Use the contact form below or email me, kurtis waldner, at
    <span style="text-decoration: underline">thelightof.life&#64;outlook.com</span>. My phone number is 605-214-2910.
  </h6>
  <form
    [formGroup]="FormData"
    (ngSubmit)="onSubmit(FormData.value)"
    style="display: flex; flex-direction: column; max-width: 80%"
  >
    <mat-form-field>
      <mat-label for="Email">Email</mat-label>
      <input
        matInput
        type="email"
        class="form-control"
        name="Email"
        aria-describedby="emailHelp"
        placeholder="Enter email"
        formControlName="Email"
      />
      <mat-hint id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</mat-hint>
    </mat-form-field>
    <mat-form-field>
      <mat-label for="fullname">Full Name</mat-label>
      <input
        matInput
        type="text"
        class="form-control"
        name="Fullname"
        placeholder="Full Name"
        formControlName="Fullname"
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label for="comment">Comment</mat-label>
      <textarea matInput class="form-control" formControlName="Comment" name="Comment"></textarea>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      class="btn btn-primary"
      style="margin-top: 12px"
      [disabled]="!FormData.valid"
    >
      Submit
    </button>
  </form>
</div>
