<div class="grid">
  <lib-number-ticker
    style="grid-column: 1 / -1"
    tileSlideIn
    matRipple
    (click)="goToProphesies([])"
    [first]="true"
    [title]="'All Prophecies'"
    [subtitle]="'A collection of prophecies throughout the Old Testament'"
    [count]="counts().prophesiesTotal"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="
      goToProphesies([
        'JesusExaltation',
        'JesusResurrection',
        'JesusSuffering',
        'JesusDeity',
        'JesusType',
        'TheSonOfMan'
      ])
    "
    [title]="'Prophecies About The Christ'"
    [subtitle]="'God foretelling what Jesus would do and what would happen soon after'"
    [count]="counts().prophesiesAboutJesus"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies([], 'include', 'Genesis')"
    [title]="'Prophecies From The Beginning'"
    [subtitle]="'From the beginning, God was foretelling what Christ would do'"
    [count]="counts().prophesiesFromTheVeryBeginning"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['ImplicitType'], 'exclude', 'All')"
    [title]="`Prophecies You Likely Haven't Seen`"
    [subtitle]="'Implied prophecies which do not have a direct reference'"
    [count]="counts().prophesiesImplied"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['TheNewBirth'], 'exclude', 'All')"
    [title]="'Prophecies About The New Birth'"
    [subtitle]="'God has not been satisfied with His creation, but seeks to make it new'"
    [count]="counts().prophesiesAboutNewBirth"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['Grace', 'Faith', 'Election', 'Promise'])"
    [title]="'Prophecies About Grace'"
    [subtitle]="'In the law, God testified to the grace found in the Lord Christ'"
    [count]="counts().prophesiesAboutGrace"
  ></lib-number-ticker>
</div>
