<div class="grid">
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['ChristExaltation', 'ChristResurrection', 'ChristSufferings'])"
    [title]="'Prophesies about Jesus'"
    [count]="counts().prophesiesAboutJesus"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['Unfulfilled'])"
    [title]="'Prophesies Unfulfilled'"
    [count]="counts().prophesiesUnfulfilled"
  ></lib-number-ticker>
</div>
