<div class="grid">
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['JesusExaltation', 'JesusResurrection', 'JesusSuffering'])"
    [title]="'Prophesies about Jesus'"
    [count]="counts().prophesiesAboutJesus"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies([])"
    [title]="'Prophesies Fulfilled'"
    [count]="counts().prophesiesFulfilled"
  ></lib-number-ticker>
  <lib-number-ticker
    tileSlideIn
    matRipple
    (click)="goToProphesies(['Unfulfilled'])"
    [title]="'Prophesies Unfulfilled'"
    [count]="counts().prophesiesUnfulfilled"
  ></lib-number-ticker>
</div>
