<mat-chip-listbox multiple aria-label="Prophecy Types" [formControl]="selectedTagsControl">
  @if(!isShown() && filterOption() === "include") {
  <mat-chip-option (click)="expandTags()">
    <span [class]="group().key"> *{{ collapsedTagType() }} </span>
  </mat-chip-option>
  } @else { @for (tag of filteredTags(); track `${tag}-${$index}`) {
  <mat-chip-option [value]="tag" (selectionChange)="toggleTags([tag], $event)">
    <span [class]="group().key">
      {{ tag }}
    </span>
  </mat-chip-option>
  } }
</mat-chip-listbox>
