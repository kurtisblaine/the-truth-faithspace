<lib-link [link]="`${baseUrl}/prophesy-item/${item()?.url}`" [textDecorationOverride]="true">
  <mat-card matRipple>
    <mat-card-header class="header-container">
      <mat-card-title libTooltip="{{ item()?.title }}">{{ item()?.title }}</mat-card-title>
      <mat-card-subtitle>
        <div libTooltip="{{ item()?.description }}">{{ item()?.description }}</div>
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="content" [matTooltip]="item()?.prophesy">
      <b>Prophesy:</b> {{ item()?.book }}
    </mat-card-content>
    <mat-card-footer class="footer">
      <mat-chip-set aria-label="Scripture Types">
        @for(tag of showTagsSorted(); track $index) {
        <mat-chip class="chip">
          <span [class]="getTagColorClass(tag)">{{ tag }}</span></mat-chip
        >
        }
      </mat-chip-set>
    </mat-card-footer>
  </mat-card>
</lib-link>
