<mat-card style="margin: 15px">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>
        <h2 class="primary-color" #seoTitle>Login</h2>
      </mat-card-title>
      <mat-card-subtitle $seoCaption> You must login to make changes to the server </mat-card-subtitle>
    </mat-card-title-group>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="formData" (ngSubmit)="onLogin()" style="display: flex; flex-direction: column; max-width: 100%">
      <mat-form-field>
        <mat-label for="Email">Email</mat-label>
        <input
          matInput
          type="email"
          class="form-control"
          name="Email"
          aria-describedby="emailHelp"
          placeholder="Enter email"
          formControlName="Email"
          required
        />
      </mat-form-field>
      <mat-form-field>
        <mat-label for="password">Password</mat-label>
        <input
          matInput
          type="password"
          class="form-control"
          name="Password"
          placeholder="Password"
          formControlName="Password"
        />
      </mat-form-field>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="btn btn-primary"
        style="width: 100%; height: 44px"
        [disabled]="!formData.valid"
      >
        Login
      </button>
    </form>
  </mat-card-content>
</mat-card>
