<div class="header">
  <mat-toolbar>
    <mat-toolbar-row>
      <img
        width="28"
        height="28"
        src="https://img.icons8.com/color/48/paint-brush.png"
        alt="paint-brush"
        style="margin-right: 7px"
      />

      <span>Dave's Drywall & Painting</span>
      <span style="flex: 1 1 auto"></span>

      <button
        mat-icon-button
        aria-labelledby="Settings button"
        aria-label="Settings button"
        [matTooltip]="'App Settings'"
        [matMenuTriggerFor]="settingsMenu"
      >
        <fa-icon [icon]="settingsIcon" [size]="'3x'"></fa-icon>
      </button>
      <mat-menu #settingsMenu="matMenu">
        <app-settings-widget></app-settings-widget>
      </mat-menu>
    </mat-toolbar-row>

    <mat-toolbar-row>
      <span>25+ Years of Experience</span>
      <span style="flex: 1 1 auto"></span>

      @if(!isMobile) {
      <ng-container *ngTemplateOutlet="phoneNumber"></ng-container>

      }
    </mat-toolbar-row>

    @if(isMobile) {
    <mat-toolbar-row>
      <ng-container *ngTemplateOutlet="phoneNumber"></ng-container>
    </mat-toolbar-row>
    }

    <ng-template #phoneNumber>
      @if(afterFirstRender) {
      <span>Free Estimates</span>
      <span style="flex: 1 1 auto"></span>
      <a href="tel:+16055495690" class="phone-number-link">
        <fa-icon [icon]="phoneIcon"></fa-icon>
        +1 (605) 496-5690
      </a>
      }
    </ng-template>
  </mat-toolbar>
</div>

<router-outlet></router-outlet>
