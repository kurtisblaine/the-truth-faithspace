<div style="display: flex">
  <h1>{{ this.selectedBook$ | async }}</h1>
</div>

<mat-card>
  <mat-card-content style="width: 100%; height: 100%">
    <cdk-virtual-scroll-viewport itemSize="100" class="example-viewport">
      <div *cdkVirtualFor="let item of dataSource">
        {{ item || "Loading..." }}
      </div>
    </cdk-virtual-scroll-viewport>
  </mat-card-content>
</mat-card>
