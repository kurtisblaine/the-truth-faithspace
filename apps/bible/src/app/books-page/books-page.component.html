<mat-accordion class="example-headers-align" multi>
  <mat-expansion-panel class="book-item" *ngFor="let book of books$ | async">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ book.name }}
      </mat-panel-title>
      <mat-panel-description> {{ book.description }} </mat-panel-description>
    </mat-expansion-panel-header>
  </mat-expansion-panel>
</mat-accordion>
