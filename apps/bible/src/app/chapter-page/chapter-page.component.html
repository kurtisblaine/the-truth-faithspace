<mat-spinner *ngIf="isLoading$ | async; let isLoading"></mat-spinner>

<mat-selection-list #shoes [multiple]="false">
  @for (chapter of chapters$ | async; track chapter) {
  <mat-list-option [value]="chapter" (click)="getScripture(chapter)"
    >{{ chapter.number }} - {{ chapter.reference }}</mat-list-option
  >
  }
</mat-selection-list>
