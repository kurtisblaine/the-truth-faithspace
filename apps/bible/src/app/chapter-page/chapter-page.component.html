<div style="display: flex">
  <h1>Chapters from {{ this.selectedBook$ | async }}</h1>
</div>

<mat-spinner *ngIf="isLoading$ | async; let isLoading"></mat-spinner>

<div class="grid">
  <mat-card
    *ngFor="let chapter of chapters$ | async"
    style="min-height: 150px; cursor: pointer"
    matRipple
    (click)="getScripture(chapter)"
  >
    <mat-card-content
      style="
        font-variant: small-caps;
        font-size: large;
        height: 100%;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
      "
    >
      {{ chapter.number }}
    </mat-card-content>
  </mat-card>
</div>
