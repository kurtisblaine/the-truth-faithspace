<mat-card style="min-height: 150px; cursor: pointer; height: 100%" matRipple (click)="chapterClicked.emit(item)">
  <mat-card-content
    style="
      font-variant: small-caps;
      font-size: large;
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
    "
  >
    {{ item.number }}
  </mat-card-content>
</mat-card>
