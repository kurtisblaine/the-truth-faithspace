<div style="display: flex">
  <h1>Tongues</h1>
</div>

<mat-spinner *ngIf="isLoading$ | async; let isLoading"></mat-spinner>

<div style="margin-bottom: 10px" *ngIf="english$ | async; let english">
  <app-language-item [item]="english"></app-language-item>
</div>

<div class="grid">
  <app-language-item *ngFor="let item of groups$ | async" [item]="item"></app-language-item>
</div>
