<mat-drawer-container style="width: 100%; height: 100%" [hasBackdrop]="true">
  <mat-drawer style="width: 200px" #drawer [mode]="'push'">
    <mat-list>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goHome(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="homeIcon" [size]="'lg'"></fa-icon>
            <span>Back to Basics</span>
          </div>
        </button>
      </mat-list-item>
      <mat-divider></mat-divider>
      <div mat-subheader>Teachings</div>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goDiscern(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="discernIcon" [size]="'lg'"></fa-icon>
            <span>Judgement</span>
          </div>
        </button>
      </mat-list-item>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goPsalm(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="psalmIcon" [size]="'lg'"></fa-icon>
            <span>Psalm</span>
          </div>
        </button>
      </mat-list-item>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goProverb(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="proverbIcon" [size]="'lg'"></fa-icon>
            <span>Wisdom</span>
          </div>
        </button>
      </mat-list-item>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goBlog(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="blogIcon" [size]="'lg'"></fa-icon>
            <span>Revelation</span>
          </div>
        </button>
      </mat-list-item>
      <mat-divider></mat-divider>
      <div mat-subheader>Contact</div>
      <mat-list-item>
        <button
          class="navigate-button"
          mat-flat-button
          (click)="goEmail(); drawer.close()"
        >
          <div class="button-items">
            <fa-icon [icon]="mailIcon" [size]="'lg'"></fa-icon>
            <span>Email</span>
          </div>
        </button>
      </mat-list-item>
    </mat-list>
  </mat-drawer>
  <mat-drawer-content>
    <div class="header">
      <mat-toolbar color="primary">
        <button mat-icon-button class="example-icon" (click)="drawer.toggle()">
          <fa-icon [icon]="icon" [size]="'lg'"></fa-icon>
        </button>

        <!-- <span>The Good News of The Kingdom of God</span> -->
      </mat-toolbar>
      <mat-progress-bar
        id="bar"
        mode="determinate"
        [value]="progressValue$ | async"
      ></mat-progress-bar>
    </div>

    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
