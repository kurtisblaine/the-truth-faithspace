<div
  class="products"
  [photoGalleryGroup]="{ arrowEl: true, indexIndicatorSep: ' - ' }"
>
  <div class="products-item" *ngFor="let image of images">
    <div class="products-item-name">{{ image.name }}</div>
    <div class="products-item-image" [photoGallery]="image.originUrl">
      <img [src]="image.thumbnailUrl" />
    </div>
  </div>
</div>
