<form [formGroup]="form">
  <div class="editor" [ngClass]="{ limitTextHeight: isEmpty && !isReadMore }">
    <ngx-editor-menu *ngIf="!readonly" [editor]="editor" [toolbar]="toolbar">
    </ngx-editor-menu>
    <ngx-editor
      class="ngx-editor"
      [editor]="editor"
      formControlName="editorContent"
      [placeholder]="'Type here...'"
    >
    </ngx-editor>
  </div>

  <button
    *ngIf="isEmpty"
    mat-flat-button
    type="button"
    (click)="showText()"
    style="width: 100%; padding: 0px"
  >
    {{ !isReadMore ? "Read More" : "Read Less" }}
  </button>
</form>
